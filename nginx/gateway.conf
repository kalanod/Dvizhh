access_log /dev/stdout request_json if=$log_request;
add_header X-Request-ID $request_id always;
proxy_hide_header X-Request-ID;

location / {
    otel_trace $trace_api_request;
    otel_span_name $request_method;
    otel_span_attr request_id $request_id;
    otel_span_attr upstream.service web-app;
    otel_span_attr upstream.status $upstream_status;
    otel_span_attr error.reason $request_error_reason;

    proxy_pass http://web_app;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header traceparent $proxy_traceparent;
    proxy_set_header tracestate "";
    proxy_set_header baggage "";
}
