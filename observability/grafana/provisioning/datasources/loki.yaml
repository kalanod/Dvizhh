apiVersion: 1

datasources:
  - name: Loki
    uid: dvizh-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 500
      derivedFields:
        - name: trace
          matcherType: label
          matcherRegex: "^trace_id$"
          datasourceUid: dvizh-tempo
          urlDisplayLabel: Открыть trace
          url: '$${__value.raw}'
        - name: Запрос
          matcherType: label
          matcherRegex: "^request_id$"
          urlDisplayLabel: Все записи запроса
          url: "/d/dvizh-logs/logs?var-service=All&var-level=All&var-search=request_id%3A$${__value.raw}&from=$${__from}&to=$${__to}"
        - name: Сессия
          matcherType: label
          matcherRegex: "^session_id$"
          urlDisplayLabel: Все записи сессии
          url: "/d/dvizh-logs/logs?var-service=All&var-level=All&var-search=session_id%3A$${__value.raw}&from=$${__from}&to=$${__to}"
