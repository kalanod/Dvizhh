load_module modules/ngx_http_js_module.so;

env COMPOSE_PROJECT_NAME;
user root root;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    access_log off;
    js_import docker from /etc/nginx/docker-api/docker.js;
    js_set $project_filter docker.projectFilter;
    subrequest_output_buffer_size 128k;

    upstream docker_engine {
        server unix:/docker.sock;
    }

    server {
        listen 2375;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location ~ ^(/v[0-9]+[.][0-9]+)?/(_ping|version)$ {
            proxy_pass http://docker_engine$uri;
        }

        location ~ ^(/v[0-9]+[.][0-9]+)?/(containers/json|networks)$ {
            proxy_pass http://docker_engine$uri?filters=$project_filter;
        }

        location ~ "^(/v[0-9]+[.][0-9]+)?/containers/[a-f0-9]{64}/(json|logs)$" {
            js_content docker.container;
        }

        location ~ "^/inspect(?<inspect_path>(/v[0-9]+[.][0-9]+)?/containers/[a-f0-9]{64}/json)$" {
            internal;
            proxy_pass http://docker_engine$inspect_path;
        }

        location ~ "^/logs(?<logs_path>(/v[0-9]+[.][0-9]+)?/containers/[a-f0-9]{64}/logs)$" {
            internal;
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_pass http://docker_engine$logs_path$is_args$args;
        }

        location / {
            return 404;
        }
    }
}
