map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

upstream backend {
    server backend:8000;
}

otel_exporter {
    endpoint alloy:4317;
}
otel_service_name web-app;

map "${NGINX_OTEL_TRACE}:$otel_parent_sampled:$uri" $trace_api_request {
    ~^on:1:/api on;
    default off;
}

map $trace_api_request $request_trace_id {
    on $otel_trace_id;
    default "";
}

map "$trace_api_request:$upstream_status" $request_span_id {
    ~^on:.+ $otel_span_id;
    default "";
}

map $trace_api_request $proxy_traceparent {
    on "00-$otel_trace_id-$otel_span_id-01";
    default "";
}

map $http_x_request_id $proxy_request_id {
    "~^[0-9a-f]{32}$" $http_x_request_id;
    default $request_id;
}

map $status $request_log_level {
    ~^5 ERROR;
    default INFO;
}

map "$uri:$upstream_status" $request_upstream {
    ~:$ "";
    ~^/api/auth/ auth-api;
    default backend;
}

map "$status:$upstream_header_time" $request_error_reason {
    ~^504:.*-$ "Upstream timed out before response headers";
    ~^502:.*-$ "Upstream did not return valid response headers";
    default "";
}

map $request_error_reason $request_log_message {
    "" "HTTP request completed";
    default $request_error_reason;
}

map "$status:$request_time" $log_api_request {
    ~^[45] 1;
    ~^[23][0-9][0-9]:[1-9] 1;
    default 0;
}

map $request_time $request_duration_ms {
    "~^(?<seconds>[1-9][0-9]*)\.(?<milliseconds>[0-9]{3})$" $seconds$milliseconds;
    "~^0\.0*(?<fraction>[0-9]{1,3})$" $fraction;
    default 0;
}

log_format request_json escape=json
    '{"timestamp":"$time_iso8601","level":"$request_log_level","service":"web-app",'
    '"message":"$request_log_message","operation":"$request_method",'
    '"request_id":"$proxy_request_id","status":$status,"duration_ms":$request_duration_ms,'
    '"upstream":"$request_upstream","upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"trace_id":"$request_trace_id","span_id":"$request_span_id",'
    '"error_reason":"$request_error_reason"}';

server {
    listen 8002;
    server_name _;
    client_max_body_size ${MEDIA_MAX_MIB}m;

    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    otel_trace $trace_api_request;
    otel_trace_context extract;
    otel_span_name $request_method;
    otel_span_attr upstream.service $request_upstream;
    otel_span_attr upstream.status $upstream_status;
    otel_span_attr error.reason $request_error_reason;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web-app"}';
    }

    location /api/auth/ {
        access_log /dev/stdout request_json if=$log_api_request;
        proxy_pass http://auth-api:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_request_id;
        proxy_set_header traceparent $proxy_traceparent;
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
    }

    location /api {
        access_log /dev/stdout request_json if=$log_api_request;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $proxy_request_id;
        proxy_set_header traceparent $proxy_traceparent;
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
    }

    # Файлы Vite с хешем в имени не меняются — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Маршрутизация SPA: неизвестные пути отдают index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
