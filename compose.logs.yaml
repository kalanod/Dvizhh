x-monitoring-logging: &monitoring-logging
  driver: local

services:
  nginx:
    environment:
      NGINX_OTEL_TRACE: "on"

  web-app:
    environment:
      NGINX_OTEL_TRACE: "on"

  backend:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces

  auth-api:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces

  recommendation-service:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces

  docker-api:
    image: nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    entrypoint: ["nginx", "-g", "daemon off; master_process off;"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./observability/docker-api:/etc/nginx/docker-api:ro
      - ./observability/docker-api/nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: /var/run/docker.sock
        target: /docker.sock
        read_only: true
        bind:
          create_host_path: false
    networks: [docker-api]
    logging:
      driver: local
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.3
    logging: *monitoring-logging
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks: [default, logs, docker-api]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    logging: *monitoring-logging
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [logs]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    logging: *monitoring-logging
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [logs]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    logging: *monitoring-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_HOME_PAGE: /d/dvizh-logs/logs
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    secrets: [grafana_admin_password]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [logs]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  logs:
  docker-api:
    internal: true

volumes:
  alloy-data:
  loki-data:
  tempo-data:
  grafana-data:

secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
