[project]
name = "dvizh-recommendation"
version = "0.1.0"
description = "Dvizh recommendation service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30,<1.0",
    "dvizh-logging",
    "grpcio>=1.84,<2.0",
    "grpcio-health-checking>=1.84,<2.0",
    "mlflow-skinny==3.17.2",
    "pgvector>=0.4,<1",
    "protobuf>=7.35.1,<8.0",
    "pydantic-settings>=2.6,<3.0",
    "redis>=8.1,<9.0",
    "sqlalchemy[asyncio]>=2.1,<3",
]

[tool.uv.sources]
dvizh-logging = { path = "../packages/dvizh-logging" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "grpcio-tools>=1.84,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]
train = [
    "scikit-learn>=1.7,<2",
]
encoder = [
    "safetensors>=0.7,<1",
    "torch>=2.11,<3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/dvizh_recommendation/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
