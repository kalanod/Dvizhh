[project]
name = "dvizh-recommendation"
version = "0.1.0"
description = "Dvizh recommendation service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio>=1.84,<2.0",
    "grpcio-health-checking>=1.84,<2.0",
    "protobuf>=7.35.1,<8.0",
    "pydantic-settings>=2.6,<3.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/dvizh_recommendation/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
