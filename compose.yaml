name: dvizh

x-service-logging: &service-logging
  driver: local
  options:
    mode: non-blocking

services:
  nginx:
    build:
      context: ./nginx
    logging: *service-logging
    environment:
      MEDIA_MAX_MIB: ${MEDIA_MAX_MIB:-10}
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8021}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      web-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web-app:
    build:
      context: ./web-app
    logging: *service-logging
    environment:
      MEDIA_MAX_MIB: ${MEDIA_MAX_MIB:-10}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      additional_contexts:
        dvizh_logging: ./packages/dvizh-logging
    logging: *service-logging
    environment:
      APP_NAME: Dvizh API
      REQUIRE_DATABASE: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dvizh_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-dvizh_data}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dvizh}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-please}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_TIMEOUT_SECONDS: ${MINIO_TIMEOUT_SECONDS:-10}
      MEDIA_MAX_MIB: ${MEDIA_MAX_MIB:-10}
      MEDIA_MAX_PIXELS: ${MEDIA_MAX_PIXELS:-25000000}
      AUTH_URL: http://auth-api:8003
      DISCOVERY_TOKEN_SECRET: ${DISCOVERY_TOKEN_SECRET:-}
      RECOMMENDATION_GRPC_ADDRESS: ${RECOMMENDATION_GRPC_ADDRESS-recommendation-service:8001}
      RECOMMENDATION_GRPC_TIMEOUT_SECONDS: ${RECOMMENDATION_GRPC_TIMEOUT_SECONDS:-2}
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      YANDEX_SUGGEST_API_KEY: ${YANDEX_SUGGEST_API_KEY:-}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
      YANDEX_SEARCH_API_KEY: ${YANDEX_SEARCH_API_KEY:-}
    depends_on:
      database-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  auth-api:
    build:
      context: ./auth-api
      additional_contexts:
        dvizh_logging: ./packages/dvizh-logging
    logging: *service-logging
    environment:
      APP_NAME: Dvizh Auth API
      JWT_SECRET: ${AUTH_JWT_SECRET:-}
      REQUIRE_DATABASE: "true"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-dvizh_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/dvizh_auth"
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  recommendation-service:
    build:
      context: ./recommendation-service
      additional_contexts:
        dvizh_logging: ./packages/dvizh-logging
    logging: *service-logging
    environment:
      APP_NAME: Dvizh Recommendation Service
      SOURCE_DATABASE_URL: postgresql://recsys_reader:${RECSYS_READER_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-dvizh_data}
      VECTOR_DATABASE_URL: postgresql://${VECTOR_USER:-dvizh}:${VECTOR_PASSWORD:-change-me}@pgvector:5432/${VECTOR_DB:-dvizh_vectors}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-5}
      RECOMMENDATION_TIMEOUT_SECONDS: ${RECOMMENDATION_TIMEOUT_SECONDS:-5}
      RANKER_MODEL_URI: ${RANKER_MODEL_URI:-}
      PREVIOUS_RANKER_MODEL_URI: ${PREVIOUS_RANKER_MODEL_URI:-}
      RANKER_MODEL_DIR: /models
      VECTOR_MODEL_ID: ${VECTOR_MODEL_ID:-}
      PREVIOUS_VECTOR_MODEL_ID: ${PREVIOUS_VECTOR_MODEL_ID:-}
    volumes:
      - ranker-models:/models:ro
    depends_on:
      database-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      pgvector-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "dvizh_recommendation.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prepare-ranker:
    profiles: [tools]
    build:
      context: ./recommendation-service
      additional_contexts:
        dvizh_logging: ./packages/dvizh-logging
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
      RANKER_MODEL_DIR: /models
    volumes:
      - ranker-models:/models
    entrypoint: ["python", "-m", "dvizh_recommendation.prepare_model"]
    command: []

  database-init:
    build:
      context: .
      dockerfile: database-init/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dvizh_data}
      POSTGRES_USER: ${POSTGRES_USER:-dvizh_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      RECSYS_READER_PASSWORD: ${RECSYS_READER_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dvizh_data}
      POSTGRES_USER: ${POSTGRES_USER:-dvizh_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      RECSYS_READER_PASSWORD: ${RECSYS_READER_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgvector:
    build:
      context: ./pgvector
    environment:
      POSTGRES_DB: ${VECTOR_DB:-dvizh_vectors}
      POSTGRES_USER: ${VECTOR_USER:-dvizh}
      POSTGRES_PASSWORD: ${VECTOR_PASSWORD:-change-me}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgvector-init:
    build:
      context: ./pgvector
    environment:
      PGHOST: pgvector
      PGDATABASE: ${VECTOR_DB:-dvizh_vectors}
      PGUSER: ${VECTOR_USER:-dvizh}
      PGPASSWORD: ${VECTOR_PASSWORD:-change-me}
      PGCONNECT_TIMEOUT: "10"
    depends_on:
      pgvector:
        condition: service_healthy
    entrypoint: ["psql"]
    command:
      - -X
      - --set=ON_ERROR_STOP=1
      - --single-transaction
      - --file=/docker-entrypoint-initdb.d/01-vector.sql
    restart: "no"

  redis:
    image: redis:8.2.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    build:
      context: ./minio
    command: server /data --console-address ":9873"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dvizh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9873}:9873"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    build:
      context: ./minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dvizh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    restart: "no"

volumes:
  postgres-data:
  pgvector-data:
  redis-data:
  minio-data:
  ranker-models:
